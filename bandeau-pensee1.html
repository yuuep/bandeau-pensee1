<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pensée et notes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{--bordeaux:#340a12;--creme:#f1e8df;--doux:rgba(52,10,18,.6);--ligne:rgba(52,10,18,.18)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;overflow:hidden}
  body{font-family:'Cormorant Garamond',Georgia,serif;color:var(--bordeaux);padding:2px}
  .bande{height:100%;max-height:150px;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr) minmax(0,1.25fr);gap:10px}
  .volet{position:relative;min-height:0;border:1px solid var(--bordeaux);border-radius:14px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 5px var(--ligne)}
  .image svg{display:block;width:100%;height:100%}
  .pensee{background:var(--bordeaux);color:var(--creme);box-shadow:inset 0 0 0 4px var(--bordeaux),inset 0 0 0 5px rgba(241,232,223,.5);display:flex;flex-direction:column;padding:12px 16px}
  h2{flex:none;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding-bottom:5px;border-bottom:1px solid var(--ligne)}
  .pensee h2{border-bottom-color:rgba(241,232,223,.25)}
  .citation{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-style:italic;font-size:15px;line-height:1.2;padding:2px}
  .etoile{position:absolute;right:12px;bottom:6px;font-size:13px;opacity:.6}
  .notes{display:flex;flex-direction:column;padding:12px 16px 10px}
  textarea{flex:1;min-height:0;width:100%;margin-top:6px;resize:none;border:0;outline:none;background:none;font:inherit;color:inherit;font-size:15px;line-height:20px;background-image:radial-gradient(var(--ligne) 1px,transparent 1.2px);background-size:12px 20px;background-position:0 16px;border-radius:0}
  textarea::placeholder{color:rgba(52,10,18,.4);font-style:italic}
  @media (max-width:520px){.bande{grid-template-columns:1fr 1fr}.image{display:none}}
</style>
</head>

    <div class="volet notes"><h2><label for="notes">Notes libres</label></h2><textarea id="notes" maxlength="1500" placeholder="Idées, envies, choses à ne pas oublier…"></textarea></div>
  </div>
<script>
(function(){
  var CLE='bandeau-notes-v1';
  var C=['Une journée de progrès vaut mieux que mille jours d’attente.','De petits pas chaque jour mènent loin.','Fais de ton mieux, reste douce avec toi-même.','Tu es capable de grandes choses.','La constance crée les résultats.','Sois fière du chemin déjà parcouru.','Petites habitudes, grands changements.','Concentre-toi sur ce qui compte.','Aujourd’hui suffit. Fais-le bien.','Ce que tu plantes aujourd’hui fleurira demain.'];
  var d=new Date(),g=d.getFullYear()*372+d.getMonth()*31+d.getDate();
  document.getElementById('citation').textContent=C[g%C.length];
  var n=document.getElementById('notes');
  try{n.value=localStorage.getItem(CLE)||'';}catch(e){}
  n.addEventListener('input',function(){try{localStorage.setItem(CLE,n.value);}catch(e){}});
  window.addEventListener('storage',function(ev){if(ev.key===CLE&&document.activeElement!==n){n.value=ev.newValue||'';}});
})();
</script>
